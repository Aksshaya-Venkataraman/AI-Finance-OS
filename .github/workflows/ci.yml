name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint, SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: bandit -c pyproject.toml -r backend alembic/env.py
      - run: pip-audit -r requirements.txt --disable-pip --no-deps

  secret-scan:
    name: Secret scan (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (incl. migrations on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway database that only exists for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ai_finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/ai_finance_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [test, lint-and-audit]
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/generate_env.py --domain localhost
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through Caddy (HTTPS)
        run: |
          curl -fsSk https://localhost/health
          curl -fsSk https://localhost/ready
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/v1/accounts)" = "401"
          curl -fsSk -X POST https://localhost/api/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"full_name":"Smoke Test","email":"smoke@example.com","password":"smoke-test-password-1"}'
          TOKEN=$(curl -fsSk -X POST https://localhost/api/v1/auth/login \
            -d 'username=smoke@example.com&password=smoke-test-password-1' | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          curl -fsSk -X POST https://localhost/api/v1/assistant/ask -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"question":"How am I doing?"}' | python3 -c \
            'import json,sys; r=json.load(sys.stdin); assert len(r["steps"]) == 5, r; print(r["answer"])'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
